<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120b06">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Log Work Day">
  <link rel="manifest" href="./quick-log.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <title>Install Log Work Day</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#120b06;color:#fff8f2;font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.card{width:min(100%,480px);padding:30px;border:1px solid #6f4326;border-radius:28px;background:#24150d;box-shadow:0 22px 70px #0008}.icon{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;margin-bottom:22px;background:#ff9147;color:#fff;font-size:38px;font-weight:700;box-shadow:0 12px 28px #ff914744}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 22px;color:#cfb7a5}ol{margin:0;padding-left:22px}li{margin:10px 0}.open{display:block;margin-top:26px;padding:15px 18px;border-radius:16px;background:#ff9147;color:#fff;text-align:center;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">€</div>
    <h1>Log Work Day</h1>
    <p>Add this small launcher once. It opens your saved Work Payment Log directly on today's shift form without Safari controls.</p>
    <ol>
      <li>Tap Share in Safari.</li>
      <li>Choose Add to Home Screen.</li>
      <li>Keep Open as Web App turned on, then tap Add.</li>
    </ol>
    <a class="open" href="./?quicklog=launcher">Preview quick log</a>
  </main>
</body>
</html>
